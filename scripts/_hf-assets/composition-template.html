<!doctype html>
<html lang="en" style="overflow:hidden; margin:0">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/core/dist/hyperframe.runtime.iife.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/shader-transitions/dist/index.global.js"></script>
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        font-weight: 700;
        font-style: normal;
        font-display: block;
        src: url(data:font/woff2;base64,__BRICOLAGE700__) format("woff2");
      }
      @font-face {
        font-family: "Bricolage Grotesque";
        font-weight: 500;
        font-style: normal;
        font-display: block;
        src: url(data:font/woff2;base64,__BRICOLAGE500__) format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 500;
        font-style: normal;
        font-display: block;
        src: url(data:font/woff2;base64,__PLEXMONO500__) format("woff2");
      }

      :root {
        --bg: #05060a;
        --ink: #f4f3fb;
        --accent: #8b7cff;
        --accent2: #43e6ff;
        --muted: rgba(244, 243, 251, 0.62);
        --font-display: "Bricolage Grotesque", sans-serif;
        --font-mono: "IBM Plex Mono", monospace;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--ink); }

      #main { position: relative; width: 1080px; height: 1920px; }

      .scene { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .glow {
        position: absolute; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(ellipse 70% 32% at 12% -4%, rgba(139,124,255,.26), transparent 55%),
          radial-gradient(ellipse 55% 26% at 100% 8%, rgba(67,230,255,.16), transparent 50%),
          radial-gradient(ellipse 50% 30% at 82% 102%, rgba(139,124,255,.12), transparent 55%);
      }
      .scene-content {
        width: 100%; height: 100%; display: flex; flex-direction: column;
        justify-content: center; align-items: center; gap: 16px; position: relative; z-index: 1;
        padding: 0 70px; text-align: center;
      }

      .display { font-family: var(--font-display); font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }
      .giant { font-size: 104px; }
      .accent-text {
        background: linear-gradient(120deg, var(--accent), var(--accent2));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .label { font-family: var(--font-mono); font-weight: 500; font-size: 27px; letter-spacing: 0.06em; color: var(--muted); }
      .eyebrow {
        font-family: var(--font-mono); font-weight: 500; font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase;
        background: linear-gradient(120deg, var(--accent), var(--accent2));
        -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 44px;
      }

      .chiprow { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 40px; max-width: 820px; }
      .chip {
        background: rgba(255,255,255,.07); backdrop-filter: blur(14px); border: 1.5px solid rgba(255,255,255,.18);
        border-radius: 17px; padding: 17px 24px; font-family: var(--font-mono); font-weight: 500; font-size: 21px; color: var(--ink);
      }

      .intgrid { display: flex; gap: 26px; justify-content: center; align-items: center; flex-wrap: wrap; max-width: 920px; }
      .icard {
        width: 232px; height: 232px; background: rgba(255,255,255,.07); backdrop-filter: blur(18px);
        border: 1.5px solid rgba(255,255,255,.22); border-radius: 36px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        box-shadow: 0 30px 60px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.24);
      }
      .icard svg { width: 78px; height: 78px; }
      .ilabel { font-family: var(--font-mono); font-weight: 500; font-size: 18px; color: var(--ink); }

      .hubdot {
        margin-top: 44px; width: 180px; height: 180px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, var(--accent2), var(--accent) 60%, #1c1442 100%);
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-display); font-weight: 700; font-size: 21px; color: #05060a;
        box-shadow: 0 0 80px rgba(139,124,255,.55);
      }

      .sitelabel { font-family: var(--font-mono); font-weight: 500; font-size: 25px; color: var(--muted); letter-spacing: 0.05em; margin-top: 8px; }

      .grain {
        position: absolute; inset: 0; pointer-events: none; z-index: 50; opacity: 0.14; mix-blend-mode: overlay;
        background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1.2px), radial-gradient(rgba(0,0,0,.18) 1px, transparent 1.2px);
        background-size: 3px 3px, 5px 5px; background-position: 0 0, 1px 2px;
      }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="15">

      <!-- SCENE 1 (0-2.5s) — kinetic typography intro; visible from t=0, non-anchor -->
      <div class="scene clip" id="s1" data-start="0" data-duration="2.5" data-track-index="0">
        <div class="glow"></div>
        <div class="scene-content">
          <h1 id="s1-word" class="display giant">
            <span class="char">Z</span><span class="char">E</span><span class="char">N</span><span class="char">I</span><span class="char">T</span><span class="char">H</span><span id="s1-ai" class="accent-text" style="display:inline-block;">AI</span>
          </h1>
          <p id="s1-sub" class="label">Always on.</p>
        </div>
      </div>

      <!-- SCENE 2 (2.5-5.5s) — services kicker, non-anchor -->
      <div class="scene clip" id="s2" data-start="2.5" data-duration="3.0" data-track-index="0" style="visibility:hidden;">
        <div class="glow"></div>
        <div class="scene-content">
          <h2 id="s2-head" class="display" style="font-size:66px;">One team.<br><span class="accent-text">Every job.</span></h2>
          <div id="s2-chips" class="chiprow">
            <div class="chip">Inbox</div>
            <div class="chip">Leads</div>
            <div class="chip">Receptionist</div>
            <div class="chip">Booking</div>
          </div>
        </div>
      </div>

      <!-- SCENE 3 (5.5-9.0s) — integrations part 1 (Gmail, Zoho), non-anchor -->
      <div class="scene clip" id="s3" data-start="5.5" data-duration="3.5" data-track-index="0" style="visibility:hidden;">
        <div class="glow"></div>
        <div class="scene-content">
          <div id="s3-eyebrow" class="eyebrow">Connects to what you use</div>
          <div class="intgrid" id="s3-grid">
            <div class="icard" id="ic-gmail">
              <svg viewBox="0 0 48 48"><path fill="#4caf50" d="M45,16.2l-5,2.75l-5,4.75L35,40h7c1.657,0,3-1.343,3-3V16.2z"/><path fill="#1e88e5" d="M3,16.2l3.614,1.71L13,23.7V40H6c-1.657,0-3-1.343-3-3V16.2z"/><path fill="#e53935" d="M35,11.2V23.7l-11,8.8l-11-8.8V11.2l11,8.8L35,11.2z"/><path fill="#c62828" d="M3,12.298V16.2l10,7.5V11.2L9.876,8.859C9.132,8.301,8.228,8,7.298,8h0C4.924,8,3,9.924,3,12.298z"/><path fill="#fbc02d" d="M45,12.298V16.2l-10,7.5V11.2l3.124-2.341C38.868,8.301,39.772,8,40.702,8h0C43.076,8,45,9.924,45,12.298z"/></svg>
              <div class="ilabel">Gmail</div>
            </div>
            <div class="icard" id="ic-zoho">
              <svg viewBox="0 0 48 48"><rect width="48" height="48" rx="9" fill="#e2311d"/><text x="24" y="31" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">ZOHO</text></svg>
              <div class="ilabel">Zoho Mail</div>
            </div>
          </div>
        </div>
      </div>

      <!-- SCENE 4 (9.0-12.0s) — integrations part 2, FIRST SHADER ANCHOR -->
      <div class="scene clip" id="s4" data-start="9.0" data-duration="3.0" data-track-index="0" style="opacity:0;">
        <div class="glow"></div>
        <div class="scene-content">
          <div class="intgrid" id="s4-grid">
            <div class="icard" id="ic-yahoo">
              <svg viewBox="0 0 48 48"><path fill="#7c4dff" d="M24,4C12.954,4,4,12.954,4,24s8.954,20,20,20s20-8.954,20-20S35.046,4,24,4z"/><path fill="#fff" d="M27.4 19.5L24.1 27.2 20.8 19.5 16.2 19.5 22.1 32.3 20 37 24.3 37 32.1 19.5zM28.9 25.3L33.8 14 29.3 14 26.4 21.3z"/></svg>
              <div class="ilabel">Yahoo Mail</div>
            </div>
            <div class="icard" id="ic-gcal">
              <svg viewBox="0 0 48 48"><rect x="4" y="8" width="40" height="36" rx="4" fill="#fff"/><rect x="4" y="8" width="40" height="10" rx="4" fill="#4285f4"/><rect x="10" y="22" width="8" height="8" fill="#4285f4"/><rect x="20" y="22" width="8" height="8" fill="#34a853"/><rect x="30" y="22" width="8" height="8" fill="#fbbc05"/><rect x="10" y="32" width="8" height="8" fill="#ea4335"/><rect x="20" y="32" width="8" height="8" fill="#4285f4"/></svg>
              <div class="ilabel">Google Calendar</div>
            </div>
            <div class="icard" id="ic-phone">
              <svg viewBox="0 0 24 24" fill="none" stroke="#43e6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <div class="ilabel">Phone &amp; SMS</div>
            </div>
          </div>
          <div class="hubdot" id="s4-hub">ZENITH AI</div>
        </div>
      </div>

      <!-- SCENE 5 (12.0-15.0s) — CTA outro, SECOND shader anchor (HyperShader manages opacity) -->
      <div class="scene clip" id="s5" data-start="12.0" data-duration="3.0" data-track-index="0" style="opacity:0;">
        <div class="glow"></div>
        <div class="scene-content">
          <div id="s5-logo" class="display giant" style="font-size:86px;">ZENITH<span class="accent-text">AI</span></div>
          <p id="s5-tag" class="label" style="margin-top:6px;">Your AI team, ready when you are.</p>
          <div id="s5-site" class="sitelabel">zenith-studio.site</div>
        </div>
      </div>

      <div class="grain"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // --- Visibility toggles ---
      tl.set("#s1", { autoAlpha: 0 }, 2.5);
      tl.set("#s2", { autoAlpha: 1 }, 2.5); tl.set("#s2", { autoAlpha: 0 }, 5.5);
      tl.set("#s3", { autoAlpha: 1 }, 5.5); tl.set("#s3", { autoAlpha: 0 }, 9.0);
      tl.set("#s4", { opacity: 1 }, 9.0);
      // s5 is the second shader anchor — HyperShader manages its opacity.

      // === SCENE 1 (0-2.5) — kinetic typography intro ===
      tl.from(".char", { y: 70, autoAlpha: 0, duration: 0.5, ease: "power3.out", stagger: { each: 0.08, from: "start" } }, 0.15);
      tl.from("#s1-ai", { scale: 0, autoAlpha: 0, duration: 0.5, ease: "back.out(1.7)" }, 0.75);
      tl.from("#s1-sub", { y: 20, autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 1.3);
      tl.to("#s1-word", { scale: 1.015, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.2);

      // === SCENE 2 (2.5-5.5) — services kicker ===
      tl.from("#s2-head", { y: 40, autoAlpha: 0, duration: 0.5, ease: "power3.out" }, 2.65);
      tl.from("#s2-chips .chip", { y: 30, autoAlpha: 0, scale: 0.8, duration: 0.45, ease: "back.out(1.6)", stagger: { each: 0.12, from: "start" } }, 3.1);
      tl.to("#s2-chips .chip", { y: -6, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.06 }, 4.0);

      // === SCENE 3 (5.5-9.0) — integrations part 1 ===
      tl.from("#s3-eyebrow", { y: 20, autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 5.65);
      tl.from("#ic-gmail", { x: -120, autoAlpha: 0, rotate: -8, duration: 0.6, ease: "back.out(1.8)" }, 6.1);
      tl.from("#ic-zoho", { x: 120, autoAlpha: 0, rotate: 8, duration: 0.6, ease: "back.out(1.8)" }, 6.35);
      tl.to("#ic-gmail", { y: -10, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 1 }, 7.1);
      tl.to("#ic-zoho", { y: -10, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 1 }, 7.35);
      tl.to("#s3-grid", { rotate: 1.2, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 7.5);

      // === SCENE 4 (9.0-12.0) — integrations part 2, shader anchor: NO container tweens ===
      tl.from("#ic-yahoo", { y: 100, autoAlpha: 0, scale: 0.7, duration: 0.5, ease: "back.out(1.8)" }, 9.15);
      tl.from("#ic-gcal", { y: 100, autoAlpha: 0, scale: 0.7, duration: 0.5, ease: "back.out(1.8)" }, 9.35);
      tl.from("#ic-phone", { y: 100, autoAlpha: 0, scale: 0.7, duration: 0.5, ease: "back.out(1.8)" }, 9.55);
      tl.from("#s4-hub", { scale: 0, autoAlpha: 0, duration: 0.5, ease: "back.out(2)" }, 9.9);
      tl.to("#s4-grid", { y: -8, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 }, 10.3);
      tl.to("#s4-hub", { scale: 1.08, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 10.5);
      tl.to("#s4-hub", { scale: 1.08, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 11.35);

      // === SCENE 5 (12.0-15.0) — CTA outro, final scene ===
      tl.from("#s5-logo", { y: 30, autoAlpha: 0, duration: 0.5, ease: "power3.out" }, 12.5);
      tl.from("#s5-tag", { y: 20, autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 12.8);
      tl.from("#s5-site", { y: 20, autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 13.05);
      tl.to("#s5-logo", { scale: 1.02, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 13.4);

      // --- One shader transition: the integrations reveal into the CTA outro ---
      window.HyperShader.init({
        bgColor: getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#05060a",
        scenes: ["s4", "s5"],
        timeline: tl,
        transitions: [{ time: 11.7, shader: "cinematic-zoom", duration: 0.6 }],
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
