<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 2000px;
    height: 1125px;
    background: #0a0b0f;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 2000px;
    height: 1125px;
    background: #0a0b0f;
    font-family: 'IBM Plex Sans', sans-serif;
    color: #eef0f5;
  }

  /* faint grid */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 64px 64px;
  }

  /* accent glow, bottom-left */
  .glow {
    position: absolute;
    left: -200px;
    bottom: -300px;
    width: 900px;
    height: 900px;
    background: radial-gradient(circle, rgba(139,124,246,0.22) 0%, rgba(139,124,246,0.07) 40%, transparent 70%);
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 92px 100px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-zenith {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.02em;
    color: #eef0f5;
  }
  .brand-lab {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.02em;
    background: #8b7cf6;
    color: #17102e;
    padding: 2px 14px;
    border-radius: 6px;
  }

  .eyebrow {
    margin-top: 44px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8b7cf6;
  }

  .title {
    margin-top: 18px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 108px;
    line-height: 1.05;
    letter-spacing: -0.005em;
    color: #f7f8fa;
  }

  .subhead {
    margin-top: 34px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 30px;
    color: #9aa3b2;
  }

  .tags {
    margin-top: 56px;
    display: flex;
    align-items: flex-start;
    gap: 18px;
  }
  .tag {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 24px;
    color: #c7cbd6;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 16px 30px;
    line-height: 1.25;
    max-width: 260px;
    text-align: left;
    white-space: nowrap;
  }
  .tag.highlight {
    color: #8b7cf6;
    font-weight: 700;
    background: rgba(139,124,246,0.12);
    border-color: rgba(139,124,246,0.55);
    max-width: 300px;
  }

  .bottom-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 10px;
    background: #8b7cf6;
  }

  /* faint scattered math glyphs — texture for the otherwise-empty lower
     canvas, echoing the subject without competing with the graphic */
  .glyph {
    position: absolute;
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: rgba(139,124,246,0.10);
    font-weight: 500;
    z-index: 1;
    user-select: none;
  }

  /* --- vector -> matrix -> neuron -> attention pipeline, spanning most
     of the card's height so the graphic reads as one continuous idea
     instead of a small cluster floating in empty space --- */
  .graphic {
    position: absolute;
    right: 100px;
    top: 130px;
    width: 860px;
    height: 900px;
  }
  .node {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-radius: 999px;
    background: #11151c;
    border: 2px solid rgba(255,255,255,0.16);
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    color: #d7dbe4;
  }
  .node .sub { font-size: 15px; font-weight: 400; color: #8b93a6; margin-top: 3px; }
  .node.vector { width: 150px; height: 150px; font-size: 26px; left: 30px; top: 0; }
  .node.matrix { width: 150px; height: 150px; font-size: 22px; left: 330px; top: 175px; }
  .node.neuron {
    width: 200px; height: 200px; font-size: 32px; left: 90px; top: 430px;
    border-color: rgba(139,124,246,0.6);
    box-shadow: 0 0 0 1px rgba(139,124,246,0.2), 0 0 50px rgba(139,124,246,0.14);
    color: #b3a6fb;
  }
  .node.attn {
    width: 250px; height: 250px; font-size: 34px; left: 380px; top: 620px;
    border-color: #8b7cf6;
    background: radial-gradient(circle at 35% 30%, rgba(139,124,246,0.16), #11151c 65%);
    box-shadow: 0 0 0 1px rgba(139,124,246,0.4), 0 0 90px rgba(139,124,246,0.28);
    color: #c9bfff;
  }
  .node.attn .sub { color: #8b7cf6; font-size: 17px; font-weight: 600; }

  .matrix-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .matrix-grid span {
    width: 20px;
    height: 20px;
    border-radius: 3px;
    background: rgba(139,124,246,0.35);
  }
  .matrix-grid span:nth-child(2) { background: rgba(255,255,255,0.12); }
  .matrix-grid span:nth-child(3) { background: rgba(255,255,255,0.12); }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="glow"></div>

    <!-- background texture: faint math glyphs filling the otherwise-empty
         lower half of the canvas -->
    <div class="glyph" style="left:1660px; top:960px; font-size:120px;">&sum;</div>
    <div class="glyph" style="left:270px; top:820px; font-size:90px;">&part;</div>
    <div class="glyph" style="left:80px; top:980px; font-size:60px;">&pi;</div>
    <div class="glyph" style="left:1780px; top:660px; font-size:80px;">&infin;</div>

    <div class="content">
      <div class="brand-row">
        <span class="brand-zenith">ZENITH</span>
        <span class="brand-lab">LAB</span>
      </div>

      <div class="eyebrow">ZENITH LAB &middot; 11 MODULE COURSE</div>
      <div class="title">Mathematics for<br />Machine Learning</div>
      <div class="subhead">Vectors to attention &middot; a real interactive lab</div>

      <div class="tags">
        <div class="tag">Linear Algebra</div>
        <div class="tag">Calculus</div>
        <div class="tag">Probability</div>
        <div class="tag highlight">No background needed</div>
      </div>
    </div>

    <div class="graphic">
      <svg width="860" height="900" style="position:absolute;left:0;top:0;overflow:visible;">
        <defs>
          <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,255,255,0.45)" />
          </marker>
          <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b7cf6" />
          </marker>
        </defs>

        <!-- vector -> matrix: y = Wx, trimmed exactly to each circle's edge -->
        <line x1="169.8" y1="112.8" x2="333.2" y2="204.9" stroke="rgba(255,255,255,0.32)" stroke-width="2" marker-end="url(#arrow-neutral)" />
        <text x="200" y="150" font-family="IBM Plex Mono, monospace" font-size="17" fill="#9aa3b2">Wx</text>

        <!-- matrix -> neuron: + b, then squashed by sigma — the training step -->
        <line x1="359.3" y1="309.5" x2="258.7" y2="443.3" stroke="#8b7cf6" stroke-width="2.5" marker-end="url(#arrow-accent)" />
        <text x="325" y="405" font-family="IBM Plex Mono, monospace" font-size="17" fill="#b3a6fb">+b, &sigma;</text>

        <!-- neuron -> attention: the dot-product score behind every attention weight -->
        <line x1="272.6" y1="586.4" x2="409.2" y2="681.4" stroke="#8b7cf6" stroke-width="2.5" marker-end="url(#arrow-accent)" />
        <text x="325" y="640" font-family="IBM Plex Mono, monospace" font-size="17" fill="#b3a6fb">q&middot;k / &radic;d</text>

        <!-- iterative gradient-descent loop, hugging the neuron it trains -->
        <path d="M 96 458 C 8 478, 8 588, 96 606" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2" stroke-dasharray="6 8" marker-end="url(#arrow-neutral)" />
        <text x="0" y="440" font-family="IBM Plex Mono, monospace" font-size="16" fill="#8b93a6">gradient</text>
        <text x="0" y="462" font-family="IBM Plex Mono, monospace" font-size="16" fill="#8b93a6">descent</text>

        <!-- decorative loss curve, filling the empty upper-right corner -->
        <g transform="translate(650,90)">
          <line x1="0" y1="0" x2="0" y2="150" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
          <line x1="0" y1="150" x2="180" y2="150" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
          <path d="M 6 18 C 50 30, 90 95, 172 138" fill="none" stroke="#8b7cf6" stroke-width="2.5" />
          <circle cx="172" cy="138" r="5" fill="#8b7cf6" />
          <text x="0" y="-12" font-family="IBM Plex Mono, monospace" font-size="15" fill="#8b93a6">loss</text>
          <text x="130" y="172" font-family="IBM Plex Mono, monospace" font-size="15" fill="#8b93a6">steps</text>
        </g>
      </svg>
      <div class="node vector">v<span class="sub">vector</span></div>
      <div class="node matrix">
        <div class="matrix-grid"><span></span><span></span><span></span><span></span></div>
        <span class="sub" style="margin-top:0;">matrix</span>
      </div>
      <div class="node neuron">&sigma;(z)<span class="sub">neuron</span></div>
      <div class="node attn">softmax<span class="sub">attention</span></div>
    </div>

    <div class="bottom-bar"></div>
  </div>
</body>
</html>
