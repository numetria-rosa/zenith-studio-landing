    return {
      finished: st.finished, active: !st.finished,
      num: 'Question ' + (st.q + 1) + ' of ' + QZ.length, q: Q.q, opts: opts, dots: dots,
      checked: st.checked, right: right, wrong: st.checked && !right, why: Q.why,
      canCheck: st.sel >= 0 && !st.checked, btnLabel: st.checked ? (st.q === QZ.length - 1 ? 'See my score' : 'Next question') : 'Check answer',
      btnOpacity: st.sel >= 0 ? '1' : '0.45',
      score: st.score + ' / ' + QZ.length, pass: st.score >= 4, retryNeeded: st.score < 4,
      scorePct: (st.score / QZ.length * 100) + '%',
      onMain: function () {
        if (st.sel < 0) return;
        if (!st.checked) { self.setState({ checked: true, score: st.score + (st.sel === Q.a ? 1 : 0) }); return; }
        if (st.q === QZ.length - 1) self.setState({ finished: true });
        else self.setState({ q: st.q + 1, sel: -1, checked: false });
      },
      onRetry: function () { self.setState({ q: 0, sel: -1, checked: false, score: 0, finished: false }); }
    };
  }
}

</script>
<script>dcMount("tpl","logic","root")</script>
</body>
