[project]
name = "zenith-agent-kit"
version = "1.0.0"
description = "Five sellable AI agents: support, WhatsApp leads, inbox, booking, document extraction."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.9",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pypdf>=4",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["agents", "core"]
