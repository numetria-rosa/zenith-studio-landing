<!doctype html><html><head><meta charset="utf-8"><title>applist</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1350px;overflow:hidden}</style><style>
  body{ font-family:'IBM Plex Sans',sans-serif; color:#141110; }
  .canvas{ position:relative; width:1080px; height:1350px; padding:64px 60px; display:flex; flex-direction:column;
    background:linear-gradient(135deg,#ffffff 0%,#ffffff 55%,#8a243222 100%); }
  .eyebrow{ font-family:'IBM Plex Mono'; font-size:15px; font-weight:700; letter-spacing:.14em; color:#8a2432; }
  h1{ font-family:'Fraunces'; font-weight:800; font-size:60px; line-height:1.06; margin-top:14px; max-width:640px; letter-spacing:-.015em; }
  .badgewrap{ position:absolute; right:60px; top:50px; width:230px; height:230px; }
  .ring{ position:absolute; inset:0; border:2.5px dashed #8a2432; border-radius:50%; opacity:.5; }
  .ring2{ position:absolute; inset:26px; border:1.5px solid #8a2432; border-radius:50%; opacity:.35; }
  .core{ position:absolute; inset:60px; background:#8a2432; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 20px 30px -14px rgba(0,0,0,.35); }
  .annot{ margin-top:18px; font-family:'Fraunces'; font-style:italic; font-size:19px; color:#5a5346; transform:rotate(-2deg); }
  .listcard{ margin-top:36px; background:#141110; border-radius:22px; padding:8px 26px; box-shadow:0 30px 50px -22px rgba(20,17,16,.5); }
  .row{ display:flex; align-items:center; gap:18px; padding:20px 0; border-bottom:1px solid rgba(255,255,255,.1); }
  .row:last-child{ border-bottom:none; }
  .ricon{ width:52px; height:52px; flex-shrink:0; background:var(--bg); border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff; }
  .rt{ font-weight:700; font-size:20px; color:#fff; }
  .rd{ margin-top:2px; font-size:14px; color:#9a938c; }
  .footer{ margin-top:auto; padding-top:24px; border-top:2px solid #141110; display:flex; justify-content:space-between; align-items:center; font-family:'IBM Plex Mono'; font-size:15px; font-weight:600; }
  .footer b{ background:#8a2432; color:#fff; padding:2px 10px; border-radius:5px; }
  </style></head><body><div class="canvas">
    <div class="eyebrow">THE AI TEAM</div>
    <h1>Build your Law Firm OS</h1>
    <div class="badgewrap"><div class="ring"></div><div class="ring2"></div><div class="core"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5l6 6M6 12l6 6M3 21l7-7M9 5l6 6-3 3-6-6z"/></svg></div></div>
    <div class="annot">runs 24/7, no hires</div>
    <div class="listcard">
    <div class="row"><span class="ricon" style="--bg:#8a2432"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h4l1.5 4-2 1.5a11 11 0 0 0 5.5 5.5l1.5-2 4 1.5v4a2 2 0 0 1-2 2C11.5 19.5 4.5 12.5 4.5 5a2 2 0 0 1 2-2Z"/></svg></span>
      <div class="rtext"><div class="rt">Intake Coordinator</div><div class="rd">Answers and qualifies every enquiry</div></div></div>
    <div class="row"><span class="ricon" style="--bg:#3d3733"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="14" height="10" rx="2"/><circle cx="9" cy="14" r="1.3"/><circle cx="15" cy="14" r="1.3"/><path d="M12 9V5M8 5h8"/></svg></span>
      <div class="rtext"><div class="rt">Follow-Up Clerk</div><div class="rd">Works the leads that didn't retain</div></div></div>
    <div class="row"><span class="ricon" style="--bg:#8a2432"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-2-1.3L14 22l-2-1.3L10 22l-2-1.3L6 22V2Z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg></span>
      <div class="rtext"><div class="rt">Billing Clerk</div><div class="rd">Reconstructs time before write-down</div></div></div></div>
    <div class="footer"><span>Comment "<b>LAW</b>" and I'll send you the breakdown</span><span>zenith-studio.site</span></div>
  </div></body></html>
