<!doctype html><html><head><meta charset="utf-8"><title>postcards</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1350px;overflow:hidden}</style><style>
  body{ background:#fff; color:#0d0d0d; font-family:'IBM Plex Sans',sans-serif; }
  .canvas{ position:relative; width:1080px; height:1350px; padding:64px 60px; display:flex; flex-direction:column; }
  h1{ font-family:'IBM Plex Sans'; font-weight:800; font-size:44px; line-height:1.15; text-align:center; letter-spacing:-.01em; }
  h1 .big{ display:block; font-size:76px; color:#c6592e; font-weight:800; }
  .stack{ position:relative; flex:1; margin-top:56px; }
  .card{ position:absolute; width:340px; background:var(--bg); color:var(--fg); border-radius:20px; padding:22px 24px 18px; box-shadow:0 26px 40px -18px rgba(0,0,0,.35); }
  .chead{ display:flex; justify-content:space-between; align-items:center; opacity:.85; }
  .cicon{ width:34px; height:34px; background:rgba(255,255,255,.18); border-radius:10px; display:flex; align-items:center; justify-content:center; }
  .cdots{ font-weight:700; letter-spacing:1px; }
  .ctext{ margin-top:22px; font-family:'Fraunces'; font-weight:800; font-size:30px; line-height:1.12; }
  .csub{ margin-top:10px; font-size:14px; opacity:.75; line-height:1.4; }
  .crow{ margin-top:20px; display:flex; gap:16px; align-items:center; opacity:.9; }
  .push{ margin-left:auto; }
  .c0{ left:10px; top:60px; transform:rotate(-7deg); z-index:1; }
  .c1{ right:0px; top:0px; transform:rotate(5deg); z-index:2; }
  .c2{ left:80px; bottom:20px; transform:rotate(-3deg); z-index:3; }
  .footer{ margin-top:auto; padding-top:24px; border-top:2.5px solid #0d0d0d; display:flex; justify-content:space-between; align-items:center; font-family:'IBM Plex Mono'; font-size:15px; font-weight:600; }
  .footer b{ background:#c6592e; color:#fff; padding:2px 10px; border-radius:5px; }
  </style></head><body><div class="canvas">
    <h1>TUTORIALS VS<span class="big">SHIPPED PRODUCT</span></h1>
    <div class="stack">
    <div class="card c0" style="--bg:#18140f;--fg:#f2ece0">
      <div class="chead"><span class="cicon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.8 2.8M16.2 16.2 19 19M19 5l-2.8 2.8M7.8 16.2 5 19"/><circle cx="12" cy="12" r="3"/></svg></span><span class="cdots">•••</span></div>
      <div class="ctext">Prompting that
actually works.</div>
      <div class="csub">Structured outputs, not vibes.</div>
      <div class="crow"><span class="cicon2"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.2 2.3 4.5 6 4.5c2 0 3.5 1 4 2.3.5-1.3 2-2.3 4-2.3 3.7 0 5.6 3.7 4 7.2C19.5 16.4 12 21 12 21Z"/></svg></span><span class="cicon2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-8.9 8.49 9 9 0 0 1-3.8-.83L3 20l1.2-4.6A8.5 8.5 0 1 1 21 11.5Z"/></svg></span><span class="cicon2 push"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg></span></div>
    </div>
    <div class="card c1" style="--bg:#f2ece0;--fg:#18140f">
      <div class="chead"><span class="cicon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4Z"/><path d="M9 4v13"/><path d="M15 6.5v13"/></svg></span><span class="cdots">•••</span></div>
      <div class="ctext">RAG that
finds the truth.</div>
      <div class="csub">Retrieval, done right.</div>
      <div class="crow"><span class="cicon2"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.2 2.3 4.5 6 4.5c2 0 3.5 1 4 2.3.5-1.3 2-2.3 4-2.3 3.7 0 5.6 3.7 4 7.2C19.5 16.4 12 21 12 21Z"/></svg></span><span class="cicon2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-8.9 8.49 9 9 0 0 1-3.8-.83L3 20l1.2-4.6A8.5 8.5 0 1 1 21 11.5Z"/></svg></span><span class="cicon2 push"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg></span></div>
    </div>
    <div class="card c2" style="--bg:#c6592e;--fg:#fff">
      <div class="chead"><span class="cicon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="14" height="10" rx="2"/><circle cx="9" cy="14" r="1.3"/><circle cx="15" cy="14" r="1.3"/><path d="M12 9V5M8 5h8"/></svg></span><span class="cdots">•••</span></div>
      <div class="ctext">Agents that
ship on their own.</div>
      <div class="csub">Reliability + evals included.</div>
      <div class="crow"><span class="cicon2"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.2 2.3 4.5 6 4.5c2 0 3.5 1 4 2.3.5-1.3 2-2.3 4-2.3 3.7 0 5.6 3.7 4 7.2C19.5 16.4 12 21 12 21Z"/></svg></span><span class="cicon2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-8.9 8.49 9 9 0 0 1-3.8-.83L3 20l1.2-4.6A8.5 8.5 0 1 1 21 11.5Z"/></svg></span><span class="cicon2 push"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg></span></div>
    </div></div>
    <div class="footer"><span>Comment "<b>AI</b>" and I'll send you the syllabus</span><span>zenith-studio.site</span></div>
  </div></body></html>
