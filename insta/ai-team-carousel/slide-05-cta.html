<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>cta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Caveat:wght@600;700&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#070b14; --card:#141b2c; --bd:rgba(148,163,184,.16); --bd2:rgba(148,163,184,.26);
    --tx:#eef2ff; --mut:#9aa6c2; --mut2:#6b7690;
    --accent:#f0b429; --accentd:#1a1204;
  }
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{ background:var(--bg); color:var(--tx); font-family:'IBM Plex Sans',sans-serif; }
  .canvas{ position:relative; width:100%; height:100%; overflow:hidden; border-radius:40px; background:var(--bg); }
  .canvas::before{
    content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(ellipse 70% 34% at 50% -6%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 55%);
  }
  .frame{ position:relative; z-index:1; padding:70px 72px; height:100%; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .logo{ font-family:'Fraunces'; font-weight:700; font-size:22px; letter-spacing:-.01em; }
  .logo b{ color:var(--accent); }

  .dm{ margin:auto; }
  .dmcard{ background:var(--card); border:1.5px solid var(--bd2); border-radius:24px; padding:26px 30px; display:inline-flex; align-items:center; gap:14px; }
  .kw{ font-family:'IBM Plex Mono'; font-weight:700; font-size:26px; color:var(--accentd); background:var(--accent); padding:8px 18px; border-radius:10px; letter-spacing:.02em; }
  .arrow{ font-size:26px; color:var(--mut); }
  .word{ font-size:22px; font-weight:600; color:var(--tx); }

  h1{ margin-top:34px; font-family:'Fraunces'; font-weight:600; font-size:44px; line-height:1.15; letter-spacing:-.02em; max-width:760px; }
  h1 i{ font-style:italic; color:var(--accent); }
  .sub{ margin-top:18px; font-size:20px; color:var(--mut); max-width:640px; }

  .cta{ margin-top:34px; font-family:'Caveat'; font-weight:700; font-size:36px; color:var(--accent); transform:rotate(-2deg); }
  .site{ margin-top:26px; font-family:'IBM Plex Mono'; font-size:15px; color:var(--mut2); letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="frame">
      <div class="logo">ZENITH<b>.</b>STUDIO</div>

      <div class="dm">
        <div class="dmcard"><span class="kw">RECEPTION</span><span class="arrow">&rarr;</span><span class="word">DM</span></div>
        <h1>Comment it. We'll send the <i>full breakdown.</i></h1>
        <div class="sub">This is one seat of the AI team that runs your support and bookings.</div>
      </div>

      <div class="cta">follow @_zenithstudio_ &#8599;</div>
      <div class="site">zenith-studio.site</div>
    </div>
  </div>
</body>
</html>
