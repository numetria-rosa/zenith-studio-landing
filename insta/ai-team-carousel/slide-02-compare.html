<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#070b14; --card:#141b2c; --bd:rgba(148,163,184,.16); --bd2:rgba(148,163,184,.26);
    --tx:#eef2ff; --mut:#9aa6c2; --mut2:#6b7690;
    --accent:#f0b429; --accentd:#1a1204;
  }
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{ background:var(--bg); color:var(--tx); font-family:'IBM Plex Sans',sans-serif; }
  .canvas{ position:relative; width:100%; height:100%; overflow:hidden; border-radius:40px; background:var(--bg); }
  .canvas::before{
    content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(ellipse 60% 26% at 100% -4%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 55%);
  }
  .frame{ position:relative; z-index:1; padding:70px 72px; height:100%; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .center-block{ margin-top:auto; margin-bottom:auto; width:100%; display:flex; flex-direction:column; align-items:center; }
  .eyebrow{ font-family:'IBM Plex Mono'; font-size:15px; font-weight:700; letter-spacing:.14em; color:var(--mut2); text-transform:uppercase; }
  h1{ font-family:'Fraunces'; font-weight:600; font-size:46px; line-height:1.12; letter-spacing:-.02em; margin-top:14px; max-width:820px; }
  h1 i{ font-style:italic; color:var(--accent); }

  .panels{ margin-top:56px; width:100%; display:flex; flex-direction:column; gap:22px; text-align:left; }
  .panel{ border-radius:22px; padding:32px 34px; border:1.5px solid var(--bd); background:var(--card); text-align:center; }
  .panel.on{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 7%, var(--card)); }
  .prow{ display:flex; align-items:center; justify-content:center; }
  .ptitle{ font-size:24px; font-weight:700; }
  .ptitle span{ color:var(--mut); font-weight:500; }
  .panel.on .ptitle span{ color:var(--accent); }
  .dots{ margin-top:22px; display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
  .dot{ width:16px; height:16px; border-radius:50%; background:var(--mut2); opacity:.5; }
  .panel.on .dot{ background:var(--accent); opacity:1; }
  .plabel{ margin-top:18px; font-family:'IBM Plex Mono'; font-size:14.5px; color:var(--mut); letter-spacing:.02em; }
  .panel.on .plabel{ color:var(--tx); }

  .footer{ width:100%; margin-top:40px; padding-top:24px; display:flex; flex-direction:column; align-items:center; gap:8px; border-top:1px solid var(--bd); }
  .swipe{ font-family:'IBM Plex Mono'; font-size:15px; font-weight:700; letter-spacing:.08em; color:var(--accent); text-transform:uppercase; }
  .site{ font-family:'IBM Plex Mono'; font-size:15px; color:var(--mut2); letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="frame">
      <div class="center-block">
        <div class="eyebrow">The math</div>
        <h1>One receptionist takes <i>one call.</i> One AI takes <i>all of them.</i></h1>

        <div class="panels">
          <div class="panel">
            <div class="prow"><div class="ptitle">Human front desk <span>&middot; 1 line</span></div></div>
            <div class="dots"><div class="dot" style="opacity:1;background:var(--mut)"></div></div>
            <div class="plabel">Every other caller gets hold music, voicemail, or a busy signal.</div>
          </div>
          <div class="panel on">
            <div class="prow"><div class="ptitle">One AI agent <span>&middot; unlimited lines</span></div></div>
            <div class="dots">
              <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
              <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
              <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
              <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="plabel">Every caller gets answered, qualified, and booked. At once.</div>
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="swipe">Swipe &rarr;</div>
        <div class="site">zenith-studio.site</div>
      </div>
    </div>
  </div>
</body>
</html>
