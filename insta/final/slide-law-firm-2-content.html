<!doctype html><html><head><meta charset="utf-8"><title>content</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1350px;overflow:hidden}</style><style>
  body{ background:#0c0c0c; color:#f2f2f0; font-family:'IBM Plex Mono',monospace; }
  .canvas{ position:relative; width:1080px; height:1350px; padding:64px 72px; display:flex; flex-direction:column; }
  .brand{ position:absolute; top:64px; left:72px; display:flex; align-items:center; }
  .wm{ font-family:'Fraunces'; font-weight:700; font-size:24px; letter-spacing:-.01em; color:#f2f2f0; }
  .wm b{ font-style:normal; padding:3px 11px; margin-left:6px; border-radius:6px; font-size:16px; }
  .middle{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .carousel{ position:absolute; left:72px; bottom:40px; display:flex; gap:9px; }
  .cdot{ width:8px; height:8px; border-radius:50%; background:#3a3a38; }
  .cdot.on{ background:#8a2432; }

  .list{ display:flex; flex-direction:column; }
  .item{ display:flex; align-items:flex-start; gap:28px; padding:30px 0; }
  .badge{ flex-shrink:0; width:60px; height:60px; background:#f2f2f0; color:#0c0c0c; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:24px; }
  .ititle{ font-weight:700; font-size:32px; }
  .idesc{ margin-top:12px; font-size:22px; color:#a8a59c; line-height:1.5; font-family:'IBM Plex Sans'; max-width:760px; }
  .divider{ height:1px; background:rgba(255,255,255,.12); }
  </style></head><body><div class="canvas">
    <div class="brand"><span class="wm">ZENITH<b style="background:#8a2432;color:#f2ece0">LAB</b></span></div>
    <div class="middle"><div class="list">
    
    <div class="item">
      <span class="badge">01</span>
      <div class="itext">
        <div class="ititle">AI INTAKE COORDINATOR</div>
        <div class="idesc">Answers and qualifies every enquiry, day or night.</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="item">
      <span class="badge">02</span>
      <div class="itext">
        <div class="ititle">AI FOLLOW-UP CLERK</div>
        <div class="idesc">Works the leads that didn't retain.</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="item">
      <span class="badge">03</span>
      <div class="itext">
        <div class="ititle">AI BILLING CLERK</div>
        <div class="idesc">Reconstructs billable time before the write-down window closes.</div>
      </div>
    </div></div></div>
    <div class="carousel"><span class="cdot"></span><span class="cdot on"></span><span class="cdot"></span></div>
  </div></body></html>
