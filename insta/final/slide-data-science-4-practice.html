<!doctype html><html><head><meta charset="utf-8"><title>stats</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1350px;overflow:hidden}</style><style>
  body{ background:#0c0c0c; color:#f2f2f0; font-family:'IBM Plex Mono',monospace; }
  .canvas{ position:relative; width:1080px; height:1350px; padding:64px 72px; display:flex; flex-direction:column; }
  .brand{ position:absolute; top:64px; left:72px; display:flex; align-items:center; }
  .wm{ font-family:'Fraunces'; font-weight:700; font-size:24px; letter-spacing:-.01em; color:#f2f2f0; }
  .wm b{ font-style:normal; padding:3px 11px; margin-left:6px; border-radius:6px; font-size:16px; }
  .middle{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .carousel{ position:absolute; left:72px; bottom:40px; display:flex; gap:9px; }
  .cdot{ width:8px; height:8px; border-radius:50%; background:#3a3a38; }
  .cdot.on{ background:#f0b429; }

  .stagelbl{ font-weight:700; font-size:22px; color:#f0b429; letter-spacing:.05em; margin-bottom:20px; }
  .headline{ font-weight:700; font-size:52px; line-height:1.16; max-width:820px; }
  .desc{ margin-top:22px; font-size:24px; color:#a8a59c; max-width:720px; line-height:1.5; font-family:'IBM Plex Sans'; }
  .stats{ margin-top:48px; display:grid; grid-template-columns:repeat(4,1fr); gap:26px 36px; }
  .snum{ font-weight:700; font-size:36px; color:#f0b429; }
  .slbl{ margin-top:6px; font-size:17px; color:#a8a59c; font-family:'IBM Plex Sans'; }
  </style></head><body><div class="canvas">
    <div class="brand"><span class="wm">ZENITH<b style="background:#f0b429;color:#1a1200">LAB</b></span></div>
    <div class="middle">
      <div class="stagelbl">GRADED PRACTICE, BY TOOL</div>
      <div class="headline">315+ real tasks, graded. Not just watched.</div>
      <div class="desc">315+ graded practice tasks across 8 tools, plus real Tableau and Power BI desktop labs, not just video.</div>
      <div class="stats"><div class="stat"><div class="snum">60</div><div class="slbl">SQL</div></div><div class="stat"><div class="snum">50</div><div class="slbl">Python</div></div><div class="stat"><div class="snum">40</div><div class="slbl">Statistics</div></div><div class="stat"><div class="snum">40</div><div class="slbl">Tableau</div></div><div class="stat"><div class="snum">40</div><div class="slbl">Power BI</div></div><div class="stat"><div class="snum">35</div><div class="slbl">Excel</div></div><div class="stat"><div class="snum">30</div><div class="slbl">Automation</div></div><div class="stat"><div class="snum">20</div><div class="slbl">Integrated</div></div></div>
    </div>
    <div class="carousel"><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot on"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span></div>
  </div></body></html>
