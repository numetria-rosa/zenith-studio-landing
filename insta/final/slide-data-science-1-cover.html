<!doctype html><html><head><meta charset="utf-8"><title>cover</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1350px;overflow:hidden}</style><style>
  body{ background:#0c0c0c; color:#f2f2f0; font-family:'IBM Plex Mono',monospace; }
  .canvas{ position:relative; width:1080px; height:1350px; padding:64px 72px; display:flex; flex-direction:column; }
  .brand{ position:absolute; top:64px; left:72px; display:flex; align-items:center; }
  .wm{ font-family:'Fraunces'; font-weight:700; font-size:24px; letter-spacing:-.01em; color:#f2f2f0; }
  .wm b{ font-style:normal; padding:3px 11px; margin-left:6px; border-radius:6px; font-size:16px; }
  .middle{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .carousel{ position:absolute; left:72px; bottom:40px; display:flex; gap:9px; }
  .cdot{ width:8px; height:8px; border-radius:50%; background:#3a3a38; }
  .cdot.on{ background:#f0b429; }

  .headline{ font-weight:700; font-size:76px; line-height:1.12; letter-spacing:-.01em; }
  .sub{ margin-top:8px; }
  .sub-line{ display:block; font-weight:700; font-size:76px; line-height:1.12; letter-spacing:-.01em; color:#f0b429; border-bottom:4px solid #f0b429; padding-bottom:5px; width:max-content; }
  .desc{ margin-top:38px; font-size:26px; color:#a8a59c; max-width:720px; line-height:1.5; font-family:'IBM Plex Sans'; }
  .prompt{ margin-top:24px; font-size:30px; color:#f2f2f0; letter-spacing:.06em; }
  .tlogorow{ margin-top:44px; display:flex; align-items:center; justify-content:center; gap:24px; flex-wrap:wrap; }
  .tlogo{ width:112px; height:112px; border-radius:24px; background:#fff; display:flex; align-items:center; justify-content:center; padding:26px; box-shadow:0 20px 40px -12px rgba(0,0,0,.5), 0 4px 10px -4px rgba(0,0,0,.3); }
  .tlogo img, .tlogo svg{ width:100%; height:100%; object-fit:contain; }
  </style></head><body><div class="canvas">
    <div class="brand"><span class="wm">ZENITH<b style="background:#f0b429;color:#1a1200">LAB</b></span></div>
    <div class="middle">
      <div class="headline"><div class="hline">YOU CAN BECOME A</div><div class="hline">DATA ANALYST</div><div class="sub"><div class="sub-line">(IN 12 WEEKS,</div><div class="sub-line">SELF-PACED)</div></div></div>
      <div class="desc">One of the most in-demand roles in tech, averaging $40-$47/hr.</div>
      <div class="prompt">&gt;&gt;&gt;</div>
    </div>
    <div class="carousel"><span class="cdot on"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span></div>
  </div></body></html>
