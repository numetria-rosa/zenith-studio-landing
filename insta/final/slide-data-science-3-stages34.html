<!doctype html><html><head><meta charset="utf-8"><title>stages</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1350px;overflow:hidden}</style><style>
  body{ background:#0c0c0c; color:#f2f2f0; font-family:'IBM Plex Mono',monospace; }
  .canvas{ position:relative; width:1080px; height:1350px; padding:64px 72px; display:flex; flex-direction:column; }
  .brand{ position:absolute; top:64px; left:72px; display:flex; align-items:center; }
  .wm{ font-family:'Fraunces'; font-weight:700; font-size:24px; letter-spacing:-.01em; color:#f2f2f0; }
  .wm b{ font-style:normal; padding:3px 11px; margin-left:6px; border-radius:6px; font-size:16px; }
  .middle{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .carousel{ position:absolute; left:72px; bottom:40px; display:flex; gap:9px; }
  .cdot{ width:8px; height:8px; border-radius:50%; background:#3a3a38; }
  .cdot.on{ background:#f0b429; }

  .stagelbl{ font-weight:700; font-size:22px; color:#f0b429; letter-spacing:.05em; margin-bottom:36px; }
  .list{ display:flex; flex-direction:column; }
  .item{ display:flex; align-items:flex-start; gap:28px; padding:24px 0; }
  .badge{ flex-shrink:0; width:64px; height:64px; background:#f2f2f0; color:#0c0c0c; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:700; font-size:15px; line-height:1.2; text-align:center; }
  .ititle{ font-weight:700; font-size:32px; line-height:1.22; }
  .idesc{ margin-top:8px; font-size:18px; color:#a8a59c; font-family:'IBM Plex Sans'; }
  .divider{ height:1px; background:rgba(255,255,255,.12); }
  </style></head><body><div class="canvas">
    <div class="brand"><span class="wm">ZENITH<b style="background:#f0b429;color:#1a1200">LAB</b></span></div>
    <div class="middle">
      <div class="stagelbl">STAGE 3-4 · QUERYING & CAPSTONE</div>
      <div class="list">
    
    <div class="item">
      <span class="badge">M6</span>
      <div class="itext">
        <div class="ititle">SQL for Analysts</div>
        <div class="idesc">45 min core lesson</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="item">
      <span class="badge">M7</span>
      <div class="itext">
        <div class="ititle">Data Visualization & Storytelling</div>
        <div class="idesc">45 min core lesson</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="item">
      <span class="badge">M8</span>
      <div class="itext">
        <div class="ititle">Dashboards & Business Communication</div>
        <div class="idesc">50 min core lesson</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="item">
      <span class="badge">M9</span>
      <div class="itext">
        <div class="ititle">Capstone: pick your case</div>
        <div class="idesc">"The Leaky Funnel," "The Churn Cliff," "The Slow Season"</div>
      </div>
    </div></div>
    </div>
    <div class="carousel"><span class="cdot"></span><span class="cdot"></span><span class="cdot on"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span></div>
  </div></body></html>
