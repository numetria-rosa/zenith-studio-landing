<!doctype html><html><head><meta charset="utf-8"><title>cta</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1350px;overflow:hidden}</style><style>
  body{ background:#0c0c0c; color:#f2f2f0; font-family:'IBM Plex Mono',monospace; }
  .canvas{ position:relative; width:1080px; height:1350px; padding:64px 72px; display:flex; flex-direction:column; }
  .brand{ position:absolute; top:64px; left:72px; display:flex; align-items:center; }
  .wm{ font-family:'Fraunces'; font-weight:700; font-size:24px; letter-spacing:-.01em; color:#f2f2f0; }
  .wm b{ font-style:normal; padding:3px 11px; margin-left:6px; border-radius:6px; font-size:16px; }
  .middle{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .carousel{ position:absolute; left:72px; bottom:40px; display:flex; gap:9px; }
  .cdot{ width:8px; height:8px; border-radius:50%; background:#3a3a38; }
  .cdot.on{ background:#f0b429; }

  .headline{ font-weight:700; font-size:64px; letter-spacing:-.01em; }
  .headline .kw{ color:#f0b429; border-bottom:4px solid #f0b429; padding-bottom:3px; }
  .desc{ margin-top:16px; font-size:26px; color:#a8a59c; font-family:'IBM Plex Sans'; }
  .divider{ margin-top:44px; height:1px; background:rgba(255,255,255,.15); }
  .follow{ margin-top:28px; display:flex; align-items:center; gap:14px; font-weight:700; font-size:19px; letter-spacing:.03em; }
  .fmark{ width:11px; height:11px; background:#f2f2f0; }
  .handle{ position:absolute; right:72px; bottom:44px; font-size:17px; color:#9a978f; }
  </style></head><body><div class="canvas">
    <div class="brand"><span class="wm">ZENITH<b style="background:#f0b429;color:#1a1200">LAB</b></span></div>
    <div class="middle">
      <div class="headline">COMMENT <span class="kw">"DATA"</span></div>
      <div class="desc">One of the most in-demand roles in tech, averaging $40-$47/hr.</div>
      <div class="divider"></div>
      <div class="follow"><span class="fmark"></span>FOLLOW FOR MORE DATA ANALYST BREAKDOWNS</div>
    </div>
    <div class="handle">@zenithlab</div>
    <div class="carousel"><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot"></span><span class="cdot on"></span></div>
  </div></body></html>
