<!doctype html><html><head><meta charset="utf-8"><title>pipeline</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;600;700;800&display=swap"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1350px;overflow:hidden}</style><style>
  body{ background:#f2ece0; color:#18140f; font-family:'IBM Plex Mono',monospace; }
  .canvas{ position:relative; width:1080px; height:1350px; padding:52px 56px; display:flex; flex-direction:column; }
  .metarow{ display:flex; justify-content:space-between; }
  .metacol{ font-size:13px; font-weight:700; letter-spacing:.08em; line-height:1.9; color:#443d33; }
  .metacol.r{ text-align:right; }
  h1{ font-family:'Fraunces'; font-optical-sizing:none; font-variation-settings:"opsz" 144; font-weight:700; font-size:52px; line-height:1.08; letter-spacing:-.015em; margin-top:26px; max-width:820px; }
  h1 .accent{ color:#c6592e; }
  .statline{ margin-top:16px; display:flex; align-items:center; gap:10px; font-size:16px; font-weight:600; color:#332e26; }
  .dot{ width:9px; height:9px; border-radius:50%; background:#c6592e; }
  .stage{ position:relative; flex:1; margin-top:42px; display:flex; align-items:flex-end; justify-content:center; gap:26px; padding-bottom:70px; }
  .stage::after{ content:""; position:absolute; left:20px; right:20px; bottom:56px; height:14px; background:#e4dbc9; border-radius:8px; box-shadow:0 18px 30px -12px rgba(24,20,15,.35); }
  .capsule{ position:relative; z-index:1; width:220px; height:300px; background:#fbf8f1; border:2px solid #18140f; border-radius:26px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; box-shadow:0 22px 26px -14px rgba(24,20,15,.3); }
  .cicon{ color:#c6592e; }
  .clabel{ font-family:'Fraunces'; font-weight:700; font-size:22px; letter-spacing:-.01em; }
  .footer{ margin-top:auto; padding-top:22px; border-top:2px solid #18140f; display:flex; justify-content:space-between; align-items:flex-end; }
  .footcol{ font-size:14px; font-weight:700; letter-spacing:.04em; max-width:380px; line-height:1.5; }
  .footcol.r{ text-align:right; }
  .cta{ font-family:'Fraunces'; font-weight:700; font-size:23px; margin-top:4px; }
  .cta b{ background:#c6592e; color:#f2ece0; padding:1px 10px; border-radius:5px; }
  </style></head><body><div class="canvas">
    <div class="metarow"><div class="metacol">LEARN<br>BUILD<br>SHIP</div><div class="metacol r">8 WEEKS<br>8 MODULES<br>8 PROJECTS</div></div>

    <div class="statline"><span class="dot"></span>8 modules · ~10 hrs/week · 8 portfolio projects</div>
    <div class="stage">
    <div class="capsule"><span class="cicon"><svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.67 4.67 4 5.5 4H13v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Z"/><path d="M20 5.5C20 4.67 19.33 4 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5v-13Z"/></svg></span><div class="clabel">Syllabus</div></div>
    <div class="capsule"><span class="cicon"><svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4Z"/><path d="M9 4v13"/><path d="M15 6.5v13"/></svg></span><div class="clabel">Roadmap</div></div>
    <div class="capsule"><span class="cicon"><svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a4 4 0 0 0 5.4-5.4L14 8l3 3 2-2"/><circle cx="19" cy="7" r="2"/><circle cx="6" cy="18" r="2"/></svg></span><div class="clabel">Career Path</div></div></div>
    <div class="footer"><div class="footcol">REAL SKILLS.<br>REAL PORTFOLIO.</div><div class="footcol r"><div class="cta">Comment "<b>AI</b>" for the syllabus.</div></div></div>
  </div></body></html>
