<!doctype html><html><head><meta charset="utf-8"><title>roadmap</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;600;700;800&display=swap"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1350px;overflow:hidden}</style><style>
  body{ background:#f5efe3; color:#18140f; font-family:'IBM Plex Sans',sans-serif; }
  .canvas{ width:1080px; height:1350px; padding:70px 64px; display:flex; flex-direction:column; }
  .pill{ align-self:flex-start; border:1.5px solid #c6592e; color:#c6592e; font-family:'IBM Plex Mono'; font-size:14px; font-weight:700; letter-spacing:.08em; padding:8px 18px; border-radius:999px; }
  h1{ font-family:'Fraunces'; font-weight:700; font-size:64px; line-height:1.08; margin-top:26px; max-width:820px; letter-spacing:-.015em; }
  h1 .accent{ color:#c6592e; }
  .roadwrap{ margin-top:70px; }
  .steplabel{ margin-top:14px; font-family:'IBM Plex Mono'; font-size:15px; color:#6b6255; }
  .cards{ margin-top:48px; display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .card{ background:#fff; border:1.5px solid rgba(24,20,15,.14); border-radius:16px; padding:18px 20px; }
  .card b{ font-family:'Fraunces'; font-size:18px; }
  .card div{ margin-top:4px; font-size:13px; color:#6b6255; }
  .footer{ margin-top:auto; padding-top:22px; border-top:2px solid #18140f; display:flex; justify-content:space-between; align-items:center; font-family:'IBM Plex Mono'; font-size:15px; }
  .footer b{ background:#c6592e; color:#fff; padding:2px 10px; border-radius:5px; }
  </style></head><body><div class="canvas">

      <path d="M940 40 v40 M940 40 h28 l-10 10 l10 10 h-28" fill="none" stroke="#c6592e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="steplabel">8 steps · from zero to shipped product</div>
    </div>
    <div class="cards">
      <div class="card"><b>Modules</b><div>8, self-contained</div></div>
      <div class="card"><b>Pace</b><div>~10 hrs/week</div></div>

    </div>
    <div class="footer"><span>Comment "<b>AI</b>" for the syllabus</span><span>zenith-studio.site</span></div>
  </div></body></html>
