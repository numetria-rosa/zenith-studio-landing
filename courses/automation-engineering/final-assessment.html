<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final assessment — AI Automation</title>
<link rel="stylesheet" href="course.css">
</head>
<body>
<div class="bar"><div class="in"><span class="logo">ZENITH<b>LAB</b></span><span class="tag">Final</span></div></div>
<div class="wrap">
  <header class="hero">
    <span class="eyebrow">Transfer test</span>
    <h1 class="serif">Final competency assessment</h1>
    <p class="sub">Ten scenarios with new numbers and new clients. If you can only pass by recognizing a memorized lab, you will miss these on purpose. 80% to pass. Unlimited retakes. Order shuffled.</p>
  </header>
  <div id="quizRoot"></div>
  <p class="assume" id="result"></p>
  <footer>Zenith Lab · AI Automation</footer>
</div>
<script src="course-progress.js"></script>
<script src="course-rail.js"></script>
<script>
if (!CourseProgress.isModuleComplete(8)) {
  document.querySelector(".wrap").innerHTML = '<header class="hero"><h1 class="serif">Locked</h1><p class="sub">Finish the capstone first.</p></header>';
} else {
  const POOL = [
    { text: "A florist's Typeform sends {Name, Mail}. HubSpot wants firstname, email. Mail is \"\". What do you do?", opts: [
      { t: "Reject the create; do not open a contact that cannot be emailed", correct: true },
      { t: "Put the shop name in email so HubSpot is happy", why: "You invented a mailbox." },
      { t: "Create the contact and hope", why: "That is how lists rot." } ]},
    { text: "Shopify webhook URL leaked in a TikTok. No HMAC. What is true?", opts: [
      { t: "Anyone can fire your 'order paid' path", correct: true },
      { t: "HTTPS alone proves the caller is Shopify", why: "TLS does not authenticate Shopify to you." },
      { t: "Leaked URLs cannot receive POST", why: "They can." } ]},
    { text: "Invoice API times out. You retry 3 times with no idempotency key. Worst case?", opts: [
      { t: "Four invoices, or four charges, if the first ones actually landed", correct: true },
      { t: "JSON becomes XML", why: "No." },
      { t: "The trigger rewinds", why: "No." } ]},
    { text: "You pick idempotency key = order_id + Date.now(). Result?", opts: [
      { t: "Every retry is a new key", correct: true },
      { t: "Maximum correctness", why: "Opposite." },
      { t: "Stripe rejects now()", why: "They reject the *effect*, not the function name." } ]},
    { text: "Model returns {\"urgency\":\"soonish\"} and schema allows only this_week|later. You:", opts: [
      { t: "Reject; soonish is not in the enum", correct: true },
      { t: "Map soonish → this_week", why: "You guessed." },
      { t: "Email the whole list about urgency", why: "Unrelated and dangerous." } ]},
    { text: "Agent tools: calendar.read, refund.execute, slack.post. For a 'reschedule my cleaning' bot you drop:", opts: [
      { t: "refund.execute", correct: true },
      { t: "calendar.read", why: "That is the job." },
      { t: "The system prompt only", why: "Keep the drop of execute." } ]},
    { text: "Closer says Slack fired twice for one lead. Logs show two deliveries, same event id, two notifies. Root cause?", opts: [
      { t: "No idempotency on the path that includes notify", correct: true },
      { t: "Slack is broken forever", why: "Your graph is." },
      { t: "JSON pretty print", why: "No." } ]},
    { text: "401 from the CRM for six hours. Your retry policy should:", opts: [
      { t: "Stop, alert a human, rotate or fix the token", correct: true },
      { t: "Retry every 200ms overnight", why: "You will get banned." },
      { t: "Switch to unsigned webhooks", why: "Unrelated." } ]},
    { text: "Client asks you to add 'an AI employee that does whatever the inbox says.' You sell:", opts: [
      { t: "A bounded extract + a human for anything that spends money or emails a list", correct: true },
      { t: "Admin on every SaaS plus the model", why: "That is not a product, it is an incident." },
      { t: "Nothing — AI cannot help inboxes", why: "It can label. It should not own execute." } ]},
    { text: "Capstone prose AI output. Notify is downstream. Correct trace?", opts: [
      { t: "AI fails schema; notify does not run", correct: true },
      { t: "Notify sends the sentence", why: "That was the fail bar." },
      { t: "CRM row is deleted automatically", why: "Not required." } ]},
  ];
  function shuffle(a) {
    const x = a.slice();
    for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = x[i]; x[i] = x[j]; x[j] = t; }
    return x;
  }
  const root = document.getElementById("quizRoot");
  let score = 0, done = 0;
  const qs = shuffle(POOL);
  qs.forEach(function (q, qi) {
    const card = document.createElement("div");
    card.className = "qcard";
    card.innerHTML = '<div class="qn">Scenario ' + (qi + 1) + ' of 10</div><div class="qtext">' + CourseProgress.escapeHtml(q.text) + "</div>";
    shuffle(q.opts).forEach(function (opt) {
      const lab = document.createElement("label");
      lab.className = "qopt";
      lab.innerHTML = "<span>" + CourseProgress.escapeHtml(opt.t) + "</span>";
      lab.onclick = function () {
        if (card.dataset.done) return;
        card.dataset.done = "1";
        done += 1;
        if (opt.correct) { score += 1; lab.classList.add("correct"); }
        else { lab.classList.add("incorrect"); }
        if (done === 10) {
          const passed = score / 10 >= 0.8;
          CourseProgress.setExtra("finalAssessment", { passed: passed, passCount: score, total: 10 });
          document.getElementById("result").textContent = score + " / 10" + (passed ? " · passed. Use Portfolio and Career Path next." : " · under 80%. Retry when you want.");
        }
      };
      card.appendChild(lab);
    });
    root.appendChild(card);
  });
}
</script>
</body>
</html>
