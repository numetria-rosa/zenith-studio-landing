<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — AI Automation</title>
<link rel="stylesheet" href="course.css">
</head>
<body>
<div class="bar"><div class="in"><span class="logo">ZENITH<b>LAB</b></span><span class="tag">Portfolio</span></div></div>
<div class="wrap">
  <header class="hero">
    <span class="eyebrow">Your record</span>
    <h1 class="serif">Portfolio</h1>
    <p class="sub">Score every rubric row and write how the workflow fails. Empty text cannot be marked complete. A recruiter can ask you to walk the retry path.</p>
  </header>
  <div id="list"></div>
  <footer>Zenith Lab · AI Automation</footer>
</div>
<script src="course-progress.js"></script>
<script src="course-rail.js"></script>
<script>
const MIN_DESC = 80;
const list = document.getElementById("list");

function canComplete(desc, scores, rubric) {
  if (String(desc || "").trim().length < MIN_DESC) return false;
  return rubric.every(function (r) {
    const n = Number(scores[r.key]);
    return n >= 1 && n <= 5;
  });
}

CourseProgress.PROJECTS.forEach(function (p) {
  const rubric = CourseProgress.rubricForProject(p.id);
  const cur = CourseProgress.getProject(p.id);
  const scores = Object.assign({}, cur.rubricScores);
  const wrap = document.createElement("div");
  wrap.className = "overallwrap";
  wrap.innerHTML = "<div class='ov-lbl'>" + CourseProgress.escapeHtml(p.title) + "</div><p class='mut' style='margin-top:8px'>" +
    CourseProgress.escapeHtml(p.summary) + "</p>";

  rubric.forEach(function (r) {
    const row = document.createElement("div");
    row.className = "rubricrow";
    const lab = document.createElement("label");
    lab.textContent = r.label + " (" + r.weight + "%)";
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", r.label + " score for " + p.title);
    sel.innerHTML = "<option value=\"\">Score</option>" +
      [1, 2, 3, 4, 5].map(function (n) { return "<option value=\"" + n + "\">" + n + " / 5</option>"; }).join("");
    if (scores[r.key]) sel.value = String(scores[r.key]);
    sel.onchange = function () {
      scores[r.key] = Number(sel.value);
      CourseProgress.setProject(p.id, { rubricScores: scores, description: ta.value });
    };
    row.appendChild(lab);
    row.appendChild(sel);
    wrap.appendChild(row);
  });

  const ta = document.createElement("textarea");
  ta.setAttribute("aria-label", "Write-up for " + p.title);
  ta.placeholder = "At least 80 characters: what you built (in-browser lab or n8n/Make), how it fails on timeout or replay, who approves money, what you would charge.";
  ta.value = cur.description || "";
  ta.onblur = function () { CourseProgress.setProject(p.id, { description: ta.value, rubricScores: scores }); };
  wrap.appendChild(ta);

  const fb = document.createElement("div");
  fb.className = "feedback";
  wrap.appendChild(fb);

  const btn = document.createElement("button");
  btn.className = "primary";
  btn.style.marginTop = "10px";
  btn.textContent = cur.completed ? "Completed" : "Mark complete";
  btn.onclick = function () {
    CourseProgress.setProject(p.id, { description: ta.value, rubricScores: scores });
    if (!canComplete(ta.value, scores, rubric)) {
      fb.className = "feedback bad";
      fb.textContent = "Score every rubric row (1–5) and write at least 80 characters on the build and its failure modes.";
      return;
    }
    CourseProgress.setProject(p.id, { completed: true, description: ta.value, rubricScores: scores });
    btn.textContent = "Completed";
    fb.className = "feedback ok";
    fb.textContent = "Saved. You should still be able to walk the retry and replay path out loud.";
  };
  wrap.appendChild(btn);
  list.appendChild(wrap);
});
</script>
</body>
</html>
