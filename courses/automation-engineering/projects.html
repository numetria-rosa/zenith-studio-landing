<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — AI Automation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="course.css">
</head>
<body>
<div class="bar"><div class="in"><span class="logo">ZENITH<b>LAB</b></span><span class="tag">Projects</span></div></div>
<div class="wrap">
    <header class="hero">
    <span class="eyebrow">Client briefs</span>
    <h1 class="serif">Eight projects</h1>
    <p class="sub">These are client briefs, not in-browser builders. Rebuild each one in n8n, Make, or Zapier if you want a demo you can show. Mark complete on the Portfolio page only after you score the rubric and write the failure modes.</p>
    </header>
  <div id="list"></div>
  <footer>Zenith Lab · AI Automation</footer>
</div>
<script src="course-progress.js"></script>
<script src="course-rail.js"></script>
<script>
const list = document.getElementById("list");
CourseProgress.PROJECTS.forEach(function (p) {
  const rub = CourseProgress.rubricForProject(p.id).map(function (r) { return r.label + " " + r.weight + "%"; }).join(" · ");
  const box = document.createElement("div");
  box.className = "box";
  box.style.marginTop = "14px";
  box.innerHTML = "<h4>" + CourseProgress.escapeHtml(p.title) + " · " + CourseProgress.escapeHtml(p.difficulty) + "</h4><p>" +
    CourseProgress.escapeHtml(p.summary) + "</p><p class='assume'>" + CourseProgress.escapeHtml(rub) + "</p>";
  list.appendChild(box);
});
const hw = document.createElement("div");
hw.className = "callout";
hw.style.marginTop = "28px";
hw.innerHTML = "<b>Off-platform homework.</b> The labs here train judgment on a simulated runtime. They do not log into HubSpot or Stripe. For each brief: draw trigger → transform → side effect on paper, then rebuild it in the tool your client can open. Leave keys, retry budget, and who approves money in the write-up.";
list.appendChild(hw);
</script>
</body>
</html>
