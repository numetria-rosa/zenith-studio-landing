<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Center — AI Automation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="zenith-lab.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="course.css">
</head>
<body>
<div class="bar"><div class="in"><span class="logo">ZENITH<b>LAB</b></span><span class="tag">Quiz Center</span></div></div>
<div class="wrap">
  <header class="hero">
    <span class="eyebrow">Practice quizzes</span>
    <h1 class="serif">Quiz Center</h1>
    <p class="sub">Separate from in-module checkpoints. Six questions per attempt, shuffled. This does not unlock modules.</p>
  </header>
  <div id="menu" class="grid2"></div>
  <div id="play" style="display:none">
    <button id="btnBack" style="margin-top:18px">← Back</button>
    <div id="quizRoot"></div>
    <p class="assume" id="result"></p>
  </div>
  <footer>Zenith Lab · AI Automation</footer>
</div>
<script src="course-progress.js"></script>
<script src="quiz-data.js"></script>
<script src="course-rail.js"></script>
<script>
const menu = document.getElementById("menu");
Object.keys(QuizData.POOLS).forEach(function (id) {
  const p = QuizData.POOLS[id];
  const a = document.createElement("button");
  a.className = "box";
  a.style.textAlign = "left";
  a.innerHTML = "<h4>Module " + id + "</h4><p>" + p.title + " · " + p.questions.length + " in pool</p>";
  a.onclick = function () { start(id); };
  menu.appendChild(a);
});
document.getElementById("btnBack").onclick = function () {
  document.getElementById("play").style.display = "none";
  menu.style.display = "grid";
};
function start(id) {
  menu.style.display = "none";
  document.getElementById("play").style.display = "block";
  const pool = QuizData.shuffle(QuizData.POOLS[id].questions).slice(0, 6);
  const root = document.getElementById("quizRoot");
  root.innerHTML = "";
  let score = 0, done = 0;
  pool.forEach(function (q, qi) {
    const card = document.createElement("div");
    card.className = "qcard";
    card.innerHTML = '<div class="qn">Question ' + (qi + 1) + '</div><div class="qtext">' + CourseProgress.escapeHtml(q.text) + "</div>";
    QuizData.shuffle(q.opts).forEach(function (opt) {
      const lab = document.createElement("label");
      lab.className = "qopt";
      lab.innerHTML = "<span>" + CourseProgress.escapeHtml(opt.t) + "</span>";
      lab.onclick = function () {
        if (card.dataset.done) return;
        card.dataset.done = "1";
        done += 1;
        if (opt.correct) { score += 1; lab.classList.add("correct"); }
        else { lab.classList.add("incorrect"); }
        document.getElementById("result").textContent = score + " / " + done + (done === pool.length ? (score / pool.length >= 0.8 ? " · strong" : " · revisit the module") : "");
      };
      card.appendChild(lab);
    });
    root.appendChild(card);
  });
}
</script>
</body>
</html>
