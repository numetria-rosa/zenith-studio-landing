<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Diagnostic — AI-Assisted Software Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="course.css">
</head>
<body>
<div class="bar"><div class="in"><span class="logo">ZENITH<b>LAB</b></span><span class="tag">Diagnostic</span></div></div>
<div class="coursenav"><div class="in"><a href="dashboard.html">&larr; Dashboard</a><a href="syllabus.html">Syllabus</a></div></div>
<div class="wrap">
  <header class="hero">
    <span class="eyebrow">Placement check</span>
    <h1 class="serif">Skill diagnostic</h1>
    <p class="sub">Five questions. This does not skip Module 1. It only tells you which practice library will feel least familiar.</p>
    <div id="quizRoot"></div>
    <p class="mono" id="scoreDisplay" style="margin-top:16px"></p>
    <div id="diagOut" class="disclosure" style="display:none;margin-top:18px"></div>
  </header>
<footer>Zenith Lab · AI-Assisted Software Engineering</footer>
</div>
<script src="course-progress.js"></script>
<script src="quiz-data.js"></script>
<script src="module-kit.js"></script>
<script>
const Q = [
  AISEQuizData.MODULE_QUIZZES[1][1],
  AISEQuizData.MODULE_QUIZZES[2][1],
  AISEQuizData.MODULE_QUIZZES[3][0],
  AISEQuizData.MODULE_QUIZZES[5][2],
  AISEQuizData.MODULE_QUIZZES[6][0],
];
ModuleKit.renderQuiz("diagnostic", Q, function () {
  const m = CourseProgress.getModule("diagnostic");
  const box = document.getElementById("diagOut");
  box.style.display = "block";
  var pct = m.total ? m.score / m.total : 0;
  if (pct >= 0.8) {
    box.innerHTML = "<b>Still start at Module 1.</b> Score stored as a diagnostic only (" + m.score + "/" + m.total + "). Stage 2 (HTML/CSS/JS) will feel like revision &mdash; do the graded exercises anyway; they check things tutorials skip. Stage 3 onward (Cursor, AI Code Detective, tests, Git, ship) is where this course is not a YouTube playlist.";
  } else {
    box.innerHTML = "<b>Still start at Module 1.</b> Score stored as a diagnostic only (" + m.score + "/" + m.total + "). Spend extra time in HTML, CSS, then JavaScript practice, in that order. The agent work in Module 7 is much easier if you can already read a small function.";
  }
  CourseProgress.setExtra("diagnostic", { score: m.score, total: m.total, at: new Date().toISOString() });
});
</script>
<script src="course-rail.js"></script>
</body>
</html>
