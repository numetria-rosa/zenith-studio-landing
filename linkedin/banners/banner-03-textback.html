<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#08080f; --bg2:#0d0e1c;
    --cyan:#5dd8ec; --violet:#9b6cff; --ink:#f3f4f8; --mut:rgba(243,244,248,.62); --mut2:rgba(243,244,248,.36);
  }
  html,body{width:1584px;height:396px;overflow:hidden}
  body{ background:var(--bg); font-family:'IBM Plex Sans',sans-serif; }
  .banner{ position:relative; width:100%; height:100%; overflow:hidden; background:
    radial-gradient(620px 420px at 84% 10%, rgba(93,216,236,.20), transparent 60%),
    radial-gradient(560px 420px at 96% 92%, rgba(155,108,255,.22), transparent 60%),
    linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
  }
  .dot{ position:absolute; border-radius:50%; background:#fff; opacity:.5; }
  .quiet{ position:absolute; left:0; bottom:0; width:360px; height:230px; }
  .content{ position:absolute; right:64px; top:0; bottom:0; width:900px; display:flex; flex-direction:column; justify-content:center; align-items:flex-end; text-align:right; }
  .eyebrow{ font-family:'IBM Plex Mono'; font-size:15px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--mut); margin-bottom:16px; }
  .headline{ font-family:'Fraunces'; font-weight:700; font-size:52px; line-height:1.14; color:var(--ink); letter-spacing:-.01em; }
  .headline .grad{ font-style:italic; background:linear-gradient(90deg,var(--cyan),var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub{ margin-top:20px; font-family:'IBM Plex Sans'; font-weight:500; font-size:19px; line-height:1.5; color:var(--mut); max-width:620px; }
  .divider{ margin-top:24px; display:flex; align-items:center; gap:14px; }
  .divider .line{ width:36px; height:1px; background:linear-gradient(90deg,transparent,var(--cyan)); }
  .divider .tag{ font-family:'IBM Plex Mono'; font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--mut2); }
</style>
</head>
<body>
  <div class="banner" id="banner">
    <div class="quiet"></div>
    <div class="content">
      <div class="eyebrow">Missed-Call Text-Back</div>
      <div class="headline">A missed call becomes<br><span class="grad">a text, not a lost client.</span></div>
      <div class="sub">The moment a call goes unanswered, an AI agent texts back and keeps the conversation going.</div>
      <div class="divider"><span class="line"></span><span class="tag">Zenith Studio</span></div>
    </div>
  </div>
  <script>
    (function(){
      var banner = document.getElementById("banner");
      var rand = function(a,b){ return a + Math.random()*(b-a); };
      for (var i=0;i<26;i++){
        var d = document.createElement("div");
        d.className = "dot";
        var s = rand(1,2.6);
        d.style.width = s+"px";
        d.style.height = s+"px";
        d.style.left = rand(0,100)+"%";
        d.style.top = rand(0,100)+"%";
        d.style.opacity = rand(.15,.55);
        banner.appendChild(d);
      }
    })();
  </script>
</body>
</html>
